name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No build step: publish the files as they are, minus repo-only bits.
      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' --exclude 'README.md' --exclude 'CLAUDE.md' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Keeps the public history short: after a deploy, delete every older run and
  # every deployment record. The live site is not affected.
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete older workflow runs
        run: |
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
            while read -r id; do
              [ "$id" = "${{ github.run_id }}" ] && continue
              gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
            done
      # Deployment records are only history; Pages keeps serving the site without them.
      - name: Delete deployment records
        run: |
          gh api --paginate "repos/$REPO/deployments?per_page=100" --jq '.[].id' |
            while read -r id; do
              gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null || true
              gh api -X DELETE "repos/$REPO/deployments/$id" || true
            done
